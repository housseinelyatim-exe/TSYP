<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4A5F6D"/></marker></defs><rect width="1600" height="1440" fill="#FFFFFF"/><rect x="20" y="20" width="390" height="1330" fill="#EDF2F4" stroke="#B7C7CE" stroke-width="1.2"/><rect x="20" y="20" width="390" height="64" fill="#D3E0E5" stroke="#B7C7CE" stroke-width="1.2"/><text x="215" y="50.0" font-size="17" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">Night / weekend guard</tspan></text><text x="215" y="71.5" font-size="13" text-anchor="middle" fill="#4F6573">on site, not allowed in the room</text><rect x="410" y="20" width="390" height="1330" fill="#E2ECEF" stroke="#B7C7CE" stroke-width="1.2"/><rect x="410" y="20" width="390" height="64" fill="#D3E0E5" stroke="#B7C7CE" stroke-width="1.2"/><text x="605" y="50.0" font-size="17" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">Nadhir</tspan></text><text x="605" y="71.5" font-size="13" text-anchor="middle" fill="#4F6573">automatic, day and night</text><rect x="800" y="20" width="390" height="1330" fill="#EDF2F4" stroke="#B7C7CE" stroke-width="1.2"/><rect x="800" y="20" width="390" height="64" fill="#D3E0E5" stroke="#B7C7CE" stroke-width="1.2"/><text x="995" y="50.0" font-size="17" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">On-call electrician (habilité)</tspan></text><text x="995" y="71.5" font-size="13" text-anchor="middle" fill="#2F6B8A">MAIN USER</text><rect x="1190" y="20" width="390" height="1330" fill="#E2ECEF" stroke="#B7C7CE" stroke-width="1.2"/><rect x="1190" y="20" width="390" height="64" fill="#D3E0E5" stroke="#B7C7CE" stroke-width="1.2"/><text x="1385" y="50.0" font-size="17" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">Maintenance &amp; plant manager</tspan></text><text x="1385" y="71.5" font-size="13" text-anchor="middle" fill="#4F6573">escalation and review</text><circle cx="605" cy="112" r="10" fill="#1F3A4A"/><rect x="440.0" y="145.0" width="330" height="80" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="605" y="171.2" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">1</tspan> Watches the existing dials,</text><text x="605" y="190.2" font-size="15" text-anchor="middle" fill="#1F3A4A">alarm lamps and siren</text><text x="605" y="209.2" font-size="15" text-anchor="middle" fill="#1F3A4A">(camera + microphone, nothing wired)</text><polyline points="605,122 605,145" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="605,262.0 715.0,300 605,338.0 495.0,300" fill="#FFF6D9" stroke="#B8962E" stroke-width="1.6"/><text x="605" y="296.4" font-size="14" text-anchor="middle" fill="#6B5410">What does</text><text x="605" y="313.4" font-size="14" text-anchor="middle" fill="#6B5410">it see?</text><polyline points="605,225 605,262" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="825.0" y="252.0" width="340" height="96" rx="10" fill="#FCF0B4" stroke="#C9A227" stroke-width="1.6"/><text x="995" y="276.4" font-size="14" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">WATCH</tspan> · SMS to the electrician only</text><text x="995" y="295.4" font-size="14" text-anchor="middle" fill="#1F3A4A">Checks the trend and time to limit,</text><text x="995" y="314.4" font-size="14" text-anchor="middle" fill="#1F3A4A">plans a daytime visit (logged).</text><text x="995" y="333.4" font-size="14" text-anchor="middle" fill="#1F3A4A">Nobody is woken up at night.</text><polyline points="715,300 825,300" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="770" y="274.6" font-size="13" text-anchor="middle" fill="#3E5361">slow drift,</text><text x="770" y="290.6" font-size="13" text-anchor="middle" fill="#3E5361">limit not reached</text><rect x="440.0" y="389.0" width="330" height="92" rx="10" fill="#F6C29A" stroke="#C9783A" stroke-width="1.6"/><text x="605" y="411.4" font-size="14" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">2 INTERVENE NOW</tspan></text><text x="605" y="430.4" font-size="14" text-anchor="middle" fill="#1F3A4A">limit reached, or 2 signals agree</text><text x="605" y="449.4" font-size="14" text-anchor="middle" fill="#1F3A4A">(dial + lamp / siren). Alert sent to</text><text x="605" y="468.4" font-size="14" text-anchor="middle" fill="#1F3A4A">guard and electrician at once</text><polyline points="605,338 605,389" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="615" y="372.6" font-size="13" text-anchor="start" fill="#3E5361">limit or alarm</text><rect x="50.0" y="529.0" width="330" height="92" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="215" y="551.8" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">3</tspan> Gets an SMS:</text><text x="215" y="570.8" font-size="15" text-anchor="middle" fill="#1F3A4A">“Alarm at the substation.</text><text x="215" y="589.8" font-size="15" text-anchor="middle" fill="#1F3A4A">Do NOT enter the room.</text><text x="215" y="608.8" font-size="15" text-anchor="middle" fill="#1F3A4A">Check from the outside.”</text><rect x="830.0" y="529.0" width="330" height="92" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="995" y="561.2" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">3</tspan> Gets SMS + push: the value,</text><text x="995" y="580.2" font-size="15" text-anchor="middle" fill="#1F3A4A">trend and time to limit.</text><text x="995" y="599.2" font-size="15" text-anchor="middle" fill="#1F3A4A">Replies “1” to acknowledge</text><polyline points="440,435 215,435 215,529" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="770,435 995,435 995,529" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><polygon points="215,673.0 330.0,715 215,757.0 100.0,715" fill="#FFF6D9" stroke="#B8962E" stroke-width="1.6"/><text x="215" y="711.4" font-size="14" text-anchor="middle" fill="#6B5410">Smoke, smell</text><text x="215" y="728.4" font-size="14" text-anchor="middle" fill="#6B5410">or noise?</text><polyline points="215,621 215,673" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="25.0" y="803.0" width="156" height="104" rx="10" fill="#F9DCC0" stroke="#D08A3C" stroke-width="1.6"/><text x="103" y="831.4" font-size="14" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">4</tspan> Replies “2”,</text><text x="103" y="850.4" font-size="14" text-anchor="middle" fill="#1F3A4A">clears the area,</text><text x="103" y="869.4" font-size="14" text-anchor="middle" fill="#1F3A4A">calls Civil</text><text x="103" y="888.4" font-size="14" text-anchor="middle" fill="#1F3A4A">Protection (198)</text><rect x="249.0" y="803.0" width="156" height="104" rx="10" fill="#ECEFF1" stroke="#8A99A3" stroke-width="1.6"/><text x="327" y="840.9" font-size="14" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">4</tspan> Replies “1”:</text><text x="327" y="859.9" font-size="14" text-anchor="middle" fill="#1F3A4A">nothing visible</text><text x="327" y="878.9" font-size="14" text-anchor="middle" fill="#1F3A4A">from outside</text><polyline points="100,715 100,803" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="90" y="709.5" font-size="13" text-anchor="end" fill="#3E5361">yes</text><polyline points="330,715 330,803" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="340" y="709.5" font-size="13" text-anchor="start" fill="#3E5361">no</text><polygon points="995,673.0 1115.0,715 995,757.0 875.0,715" fill="#FFF6D9" stroke="#B8962E" stroke-width="1.6"/><text x="995" y="711.4" font-size="14" text-anchor="middle" fill="#6B5410">Acknowledged</text><text x="995" y="728.4" font-size="14" text-anchor="middle" fill="#6B5410">within 5 min?</text><polyline points="995,621 995,673" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1220.0" y="659.0" width="330" height="112" rx="10" fill="#F9DCC0" stroke="#D08A3C" stroke-width="1.6"/><text x="1385" y="691.4" font-size="14" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">Safety net</tspan>: Nadhir calls the</text><text x="1385" y="710.4" font-size="14" text-anchor="middle" fill="#1F3A4A">electrician (voice call, 2G backup);</text><text x="1385" y="729.4" font-size="14" text-anchor="middle" fill="#1F3A4A">still no reply → calls the maintenance</text><text x="1385" y="748.4" font-size="14" text-anchor="middle" fill="#1F3A4A">manager, then the plant manager</text><polyline points="1115,715 1220,715" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="1135" y="707.5" font-size="13" text-anchor="start" fill="#3E5361">no</text><rect x="455.0" y="954.0" width="300" height="72" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="605" y="985.8" font-size="15" text-anchor="middle" fill="#1F3A4A">Guard's reply is added</text><text x="605" y="1004.8" font-size="15" text-anchor="middle" fill="#1F3A4A">to the alert, visible to all</text><polyline points="103,907 103,990 455,990" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="327,907 327,990" fill="none" stroke="#4A5F6D" stroke-width="1.6"/><rect x="830.0" y="944.0" width="330" height="92" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="995" y="976.2" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">4</tspan> Sees live dials, the trend</text><text x="995" y="995.2" font-size="15" text-anchor="middle" fill="#1F3A4A">and the guard's reply on the</text><text x="995" y="1014.2" font-size="15" text-anchor="middle" fill="#1F3A4A">phone, without entering the room</text><polyline points="995,757 995,944" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="1005" y="794.5" font-size="13" text-anchor="start" fill="#3E5361">yes</text><polyline points="755,990 830,990" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="1385,771 1385,990 1160,990" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><text x="1395" y="896.5" font-size="13" text-anchor="start" fill="#3E5361">first person</text><text x="1395" y="912.5" font-size="13" text-anchor="start" fill="#3E5361">to answer</text><rect x="830.0" y="1084.0" width="330" height="112" rx="10" fill="#DCE8D5" stroke="#6E9A57" stroke-width="1.6"/><text x="995" y="1116.8" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">5</tspan> Decides and replies:</text><text x="995" y="1135.8" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">COMING</tspan>: on site, consignation + PPE</text><text x="995" y="1154.8" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">WATCH</tspan>: keeps watching remotely</text><text x="995" y="1173.8" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">FALSE ALARM</tspan>: helps recalibrate</text><polyline points="995,1036 995,1083" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="455.0" y="1094.0" width="300" height="92" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="605" y="1126.2" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">6</tspan> Decision log: who was alerted,</text><text x="605" y="1145.2" font-size="15" text-anchor="middle" fill="#1F3A4A">when they acknowledged,</text><text x="605" y="1164.2" font-size="15" text-anchor="middle" fill="#1F3A4A">the decision and the outcome</text><polyline points="830,1140 755,1140" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1220.0" y="1212.0" width="330" height="76" rx="10" fill="#F4F7F9" stroke="#5C7180" stroke-width="1.6"/><text x="1385" y="1236.2" font-size="15" text-anchor="middle" fill="#1F3A4A"><tspan font-weight="700">7</tspan> Next morning: reviews alerts,</text><text x="1385" y="1255.2" font-size="15" text-anchor="middle" fill="#1F3A4A">response times and false alarms</text><text x="1385" y="1274.2" font-size="15" text-anchor="middle" fill="#1F3A4A">on the dashboard</text><polyline points="605,1186 605,1250 1220,1250" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><circle cx="1385" cy="1312" r="11" fill="none" stroke="#1F3A4A" stroke-width="2"/><circle cx="1385" cy="1312" r="6.5" fill="#1F3A4A"/><polyline points="1385,1288 1385,1299" fill="none" stroke="#4A5F6D" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="1369" width="22" height="16" rx="3" fill="#FCF0B4" stroke="#C9A227"/><text x="54" y="1382.9" font-size="14" text-anchor="start" fill="#3E5361">WATCH: slow drift, no urgency</text><rect x="308.4" y="1369" width="22" height="16" rx="3" fill="#F6C29A" stroke="#C9783A"/><text x="338.4" y="1382.9" font-size="14" text-anchor="start" fill="#3E5361">INTERVENE NOW</text><rect x="471.2" y="1369" width="22" height="16" rx="3" fill="#F9DCC0" stroke="#D08A3C"/><text x="501.2" y="1382.9" font-size="14" text-anchor="start" fill="#3E5361">Safety nets: guard check, voice call, escalation</text><text x="24" y="1412.5" font-size="13" text-anchor="start" fill="#3E5361">Not shown: an unreadable dial gives a “check needed” message, never a false value. If Nadhir itself goes silent, the cloud watchdog sends SYSTEM OFFLINE to the electrician.</text></svg>