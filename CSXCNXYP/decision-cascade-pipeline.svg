<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7a5cff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="520" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Three-Tier Decision / Verdict Cascade</text>
  <text x="520" y="50" text-anchor="middle" font-size="13" fill="#555555">Applies to City Brain's dispatch decision and to Guardian's trust verdict, with matching terminology substituted</text>

  <!-- Input box -->
  <rect x="20" y="220" width="140" height="90" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Input</text>
  <text x="90" y="275" text-anchor="middle" font-size="11" fill="#333333">Incident (City Brain)</text>
  <text x="90" y="290" text-anchor="middle" font-size="11" fill="#333333">/ Reading (Guardian)</text>

  <!-- Tier 1 box -->
  <rect x="220" y="200" width="200" height="130" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Tier 1</text>
  <text x="320" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Rule-Based Engine</text>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#333333">Fast, deterministic</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#333333">Known incident types /</text>
  <text x="320" y="302" text-anchor="middle" font-size="11" fill="#333333">known attack signatures</text>
  <text x="320" y="318" text-anchor="middle" font-size="10" font-style="italic" fill="#1d4ed8">Sections 4.3 / 5.2</text>

  <!-- Tier 2 box -->
  <rect x="480" y="200" width="200" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="580" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Tier 2</text>
  <text x="580" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Decision / Verdict Cache</text>
  <text x="580" y="270" text-anchor="middle" font-size="11" fill="#333333">Match &amp; reuse</text>
  <text x="580" y="286" text-anchor="middle" font-size="11" fill="#333333">Reuses recent decisions</text>
  <text x="580" y="302" text-anchor="middle" font-size="11" fill="#333333">for similar past cases</text>
  <text x="580" y="318" text-anchor="middle" font-size="10" font-style="italic" fill="#b45309">no repeated LLM cost</text>

  <!-- Tier 3 box -->
  <rect x="740" y="200" width="220" height="130" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="850" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Tier 3</text>
  <text x="850" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Criticality LLM</text>
  <text x="850" y="270" text-anchor="middle" font-size="11" fill="#333333">Invoked only for</text>
  <text x="850" y="286" text-anchor="middle" font-size="11" fill="#333333">novel / ambiguous / critical</text>
  <text x="850" y="302" text-anchor="middle" font-size="11" fill="#333333">cases the table can't cover</text>
  <text x="850" y="318" text-anchor="middle" font-size="10" font-style="italic" fill="#6d28d9">rare, so cost/latency is affordable</text>

  <!-- Output box -->
  <rect x="360" y="440" width="240" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="480" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Output</text>
  <text x="480" y="486" text-anchor="middle" font-size="11" fill="#333333">Decision (dispatch actuator) /</text>
  <text x="480" y="502" text-anchor="middle" font-size="11" fill="#333333">Verdict (trusted / suspect / rejected)</text>

  <!-- Fallback box -->
  <rect x="730" y="440" width="240" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="850" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">If LLM unavailable</text>
  <text x="850" y="480" text-anchor="middle" font-size="10.5" fill="#333333">City Brain: most conservative</text>
  <text x="850" y="494" text-anchor="middle" font-size="10.5" fill="#333333">matching rule action</text>
  <text x="850" y="508" text-anchor="middle" font-size="10.5" fill="#333333">Guardian: fail closed to "suspect"</text>

  <!-- Arrows: main flow -->
  <path d="M160,265 L220,265" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <path d="M420,240 L480,240" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="450" y="232" text-anchor="middle" font-size="10" fill="#444444">no rule match</text>

  <path d="M680,240 L740,240" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="710" y="232" text-anchor="middle" font-size="10" fill="#444444">no cache hit</text>

  <!-- down arrows to output -->
  <path d="M300,330 C300,390 400,410 440,440" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="400" text-anchor="middle" font-size="10" fill="#1d4ed8">rule match: fire rule</text>

  <path d="M560,330 C560,380 520,410 500,440" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="400" text-anchor="middle" font-size="10" fill="#b45309">cache hit: reuse decision</text>

  <path d="M830,330 C830,380 650,420 600,440" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="760" y="420" text-anchor="middle" font-size="10" fill="#6d28d9">LLM resolves novel case</text>

  <!-- Tier3 to fallback -->
  <path d="M900,330 L920,440" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="960" y="390" text-anchor="middle" font-size="10" fill="#b91c1c">LLM unreachable</text>

  <!-- fallback to output -->
  <path d="M730,480 L600,480" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="665" y="472" text-anchor="middle" font-size="10" fill="#b91c1c">safe default applied</text>

  <!-- Feedback loop (dashed) -->
  <path d="M850,200 C850,120 450,110 320,200" stroke="#7a5cff" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <path d="M850,200 C850,140 620,130 580,200" stroke="#7a5cff" stroke-width="2" fill="none" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <text x="585" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5cff">Hardening milestone (Section 9): frequent Tier-3 resolutions are</text>
  <text x="585" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#7a5cff">validated offline and promoted into Tier 1 rules / Tier 2 cache entries</text>

</svg>
