<text x="695" y="500" font-size="13" font-weight="400" fill="#4b5563" text-anchor="middle" >called only on incidents</text>
<text x="695" y="520" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle" >understands the city</text>
<text x="695" y="540" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle" >proposes actions</text>
