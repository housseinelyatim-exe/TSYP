<text x="850" y="650" font-size="13.5" font-weight="600" fill="#1e3a8a" text-anchor="middle" >scores every proposal · picks the best action</text>
<text x="850" y="672" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle" >Guardian trust: trusted counts fully · suspect counts less · rejected counts 0</text>
<text x="850" y="691" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" >Guardian down → safe mode</text>
<path d="M695 560 L695 596" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a)"/>
