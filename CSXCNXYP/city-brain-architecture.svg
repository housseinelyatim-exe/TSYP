<text x="1015" y="584" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="start" >fallback proposals</text>
<rect x="555" y="728" width="590" height="88" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
<text x="850" y="754" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle" >Safety rules  (the score can never override them)</text>
<text x="850" y="776" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle" >no quarantined device · never act only on rejected readings</text>
<text x="850" y="796" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle" >risky actions need ≥ 2 sensors agreeing · cooldown between repeated actions</text>
