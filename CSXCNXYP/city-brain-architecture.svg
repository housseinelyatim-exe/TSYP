<text x="1007" y="520" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle" >used when the LLM is</text>
<text x="1007" y="540" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle" >slow or offline</text>
